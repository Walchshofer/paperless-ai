name: Python tests (unit & integration)

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    # Fail the job after 30 minutes to avoid long-running hung jobs
    timeout-minutes: 30
    strategy:
      matrix:
        python: [3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          # Capture verbose unit test output to a file so CI artifacts contain failure logs
          python -m pytest test/unit -q -r a | tee unit_tests_output.txt; exit ${PIPESTATUS[0]}

      - name: Upload unit test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: unit_tests_output.txt

      - name: Run integration tests (with diagnostics & timeout)
        run: |
          # Run integration tests with DEBUG logs (for richer diagnostics) and
          # enforce a 10-minute timeout to fail fast on hangs. Capture output
          # to an artifact file for faster debugging.
          LOG_LEVEL=DEBUG BRIDGE_TEST_STUBS=0 timeout 10m python -m pytest test/integration -q -r a -s -vv | tee integration_tests_output.txt; exit ${PIPESTATUS[0]}

      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: integration_tests_output.txt
