name: verification-fast

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    paths:
      - 'src/**'
      - 'prompts/**'
      - 'migrations/**'

# Define top-level env to satisfy static linter checks (Detox)
env:
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""
  POSTGRES_HOST: ""

jobs:
  verification-fast:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Use pgvector image required for embedding storage
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: elfman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paperless_test
        options: >-
          --health-cmd "pg_isready -U elfman -d paperless_test" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Load CI environment (secrets or fallback .env)
        shell: bash
        env:
          # Explicitly map secrets to resolve "Context access might be invalid"
          SECRET_USER: ${{ secrets.POSTGRES_USER }}
          SECRET_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_DB: ${{ secrets.POSTGRES_DB }}
          SECRET_HOST: ${{ secrets.POSTGRES_HOST }}
        run: |
          echo "Loading CI env (secrets preferred)"
          
          # Prefer repository secrets if provided
          if [ -n "$SECRET_USER" ]; then
            USER="$SECRET_USER"
            PASS="$SECRET_PASS"
            DBNAME="$SECRET_DB"
            HOST="$SECRET_HOST"
          elif [ -f paperless-ngx/.env ]; then
            set -o allexport
            source paperless-ngx/.env
            set +o allexport
            USER="$POSTGRES_USER"
            PASS="$POSTGRES_PASSWORD"
            DBNAME="$POSTGRES_DB"
            HOST="${POSTGRES_HOST:-localhost}"
          else
            echo "WARNING: Using safe test fallback values" >&2
            USER="elfman"
            PASS="password"
            DBNAME="paperless_test"
            HOST="localhost"
          fi

          # Export to GITHUB_ENV for subsequent steps
          echo "POSTGRES_USER=$USER" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "POSTGRES_DB=$DBNAME" >> $GITHUB_ENV
          echo "POSTGRES_HOST=$HOST" >> $GITHUB_ENV
          echo "POSTGRES_URL=postgres://$USER:$PASS@$HOST:5432/$DBNAME" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Run DB schema check
        env:
          # Use the dynamic URL generated in the load step
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
        run: node scripts/check-db-schema.js || true

      - name: Run unit tests
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
        run: npm test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast-logs
          path: test-output/**