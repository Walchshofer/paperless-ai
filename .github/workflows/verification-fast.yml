name: verification-fast

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    paths:
      - 'src/**'
      - 'prompts/**'
      - 'migrations/**'

jobs:
  verification-fast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: elfman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paperless_test
        options: >-
          --health-cmd "pg_isready -U elfman -d paperless_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run DB schema check
        env:
          POSTGRES_URL: 'postgres://elfman:password@localhost:5432/paperless_test'
        run: node scripts/check-db-schema.js || true
      - name: Run Islands check
        run: node scripts/check-islands.js || true
      - name: Run unit tests
        env:
          POSTGRES_URL: 'postgres://elfman:password@localhost:5432/paperless_test'
        run: npm test
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast-logs
          path: test-output/**
