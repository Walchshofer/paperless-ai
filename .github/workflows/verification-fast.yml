name: verification-fast

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    paths:
      - 'src/**'
      - 'prompts/**'
      - 'migrations/**'

jobs:
  verification-fast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: elfman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paperless_test
        options: >-
          --health-cmd "pg_isready -U elfman -d paperless_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Load CI environment (secrets or fallback .env)
        shell: bash
        run: |
          echo "Loading CI env (secrets preferred)"
          # Prefer repository secrets if provided
          if [ -n "${{ secrets.POSTGRES_USER }}" ]; then
            USER="${{ secrets.POSTGRES_USER }}"
            PASS="${{ secrets.POSTGRES_PASSWORD }}"
            DBNAME="${{ secrets.POSTGRES_DB }}"
            HOST="${{ secrets.POSTGRES_HOST }}"
          elif [ -f paperless-ngx/.env ]; then
            set -o allexport
            source paperless-ngx/.env
            set +o allexport
            USER="$POSTGRES_USER"
            PASS="$POSTGRES_PASSWORD"
            DBNAME="$POSTGRES_DB"
            HOST="${POSTGRES_HOST:-localhost}"
          elif [ -f paperless-ngx/docker-compose.env ]; then
            set -o allexport
            source paperless-ngx/docker-compose.env
            set +o allexport
            USER="$POSTGRES_USER"
            PASS="$POSTGRES_PASSWORD"
            DBNAME="$POSTGRES_DB"
            HOST="${POSTGRES_HOST:-localhost}"
          else
            echo "WARNING: No secrets or .env found; using safe test fallback values" >&2
            USER="elfman"
            PASS="password"
            DBNAME="paperless_test"
            HOST="localhost"
          fi

          # Normalize host and export to GITHUB_ENV for subsequent steps
          HOST="${HOST:-localhost}"
          echo "POSTGRES_USER=$USER" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "POSTGRES_DB=$DBNAME" >> $GITHUB_ENV
          echo "POSTGRES_HOST=$HOST" >> $GITHUB_ENV
          echo "POSTGRES_URL=postgres://$USER:$PASS@$HOST:5432/$DBNAME" >> $GITHUB_ENV

      - name: Verify DB credentials present
        shell: bash
        run: |
          echo "Verifying DB credentials..."
          if [ -z "$POSTGRES_USER" ] || [ -z "$POSTGRES_PASSWORD" ] || [ -z "$POSTGRES_DB" ]; then
            echo "ERROR: required DB credentials missing (POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB)" >&2
            exit 1
          fi
          echo "OK: DB credentials present"

      - name: Install dependencies
        run: npm ci
      - name: Run DB schema check
        env:
          POSTGRES_URL: 'postgres://elfman:password@localhost:5432/paperless_test'
        run: node scripts/check-db-schema.js || true
      - name: Run Islands check
        run: node scripts/check-islands.js || true
      - name: Run unit tests
        env:
          POSTGRES_URL: 'postgres://elfman:password@localhost:5432/paperless_test'
        run: npm test
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-fast-logs
          path: test-output/**
