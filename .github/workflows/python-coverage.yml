name: Python Coverage

on:
  pull_request:
    paths:
      - "**/*.py"
      - "test/**"
  push:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov coverage

      - name: Run Python tests with coverage
        run: |
          pytest test/unit test/integration test/e2e -q --cov=bridge --cov-report=term-missing --cov-fail-under=80


  e2e:
    name: Optional Serena E2E
    needs: coverage
    runs-on: ubuntu-latest
    if: ${{ secrets.SERENA_E2E == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify Serena endpoint
        run: |
          # Pull secret into a shell variable to avoid step-level env interpolation
          SECRET_SERENA_BASE="${{ secrets.SERENA_BASE }}"
          SERENA_BASE="${SECRET_SERENA_BASE:-}"

          if [ -z "$SERENA_BASE" ]; then echo "SERENA_BASE secret not set" >&2; exit 1; fi
          echo "Checking Serena base: $SERENA_BASE"
          for i in 1 10; do
            if curl --fail --silent "$SERENA_BASE/health" >/dev/null 2>&1; then
              echo "Serena health check passed"
              exit 0
            fi
            echo "Waiting for Serena... ($i)"
            sleep 3
          done
          echo "Serena not reachable at $SERENA_BASE" >&2
          exit 1

      - name: Run Serena E2E tests
        run: |
          # Pull secret into a shell variable and export required envs
          SECRET_SERENA_BASE="${{ secrets.SERENA_BASE }}"
          if [ -z "$SECRET_SERENA_BASE" ]; then echo "SERENA_BASE secret not set; failing Serena E2E" >&2; exit 1; fi
          export SERENA_E2E='1'
          export SERENA_BASE="$SECRET_SERENA_BASE"
          pytest test/e2e -q -k test_serena_e2e.py

