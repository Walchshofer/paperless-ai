name: Runtime asset check

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Build island runtime
        run: npm run build:island-runtime
      - name: Verify island runtime asset
        run: npm run check:island-runtime
