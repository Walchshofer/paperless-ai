name: Alpha-9 Integration Verification

on:
  pull_request:
    branches: [main, release/**]
  workflow_dispatch: {}

# Integration verification pipeline - runs on every PR
# Target execution time: < 15 minutes

env:
  POSTGRES_URL: postgres://elfman:password@localhost:5432/paperless_test
  QDRANT_URL: http://localhost:6333
  SIDECAR_URL: http://localhost:8001
  NODE_ENV: test
  METRICS_INTERNAL_ONLY: 'false'

jobs:
  handshake-tests:
    name: Sidecar Handshake Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: elfman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paperless_test
        options: >-
          --health-cmd "pg_isready -U elfman -d paperless_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run handshake integration tests
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
          SIDECAR_URL: ${{ env.SIDECAR_URL }}
          SKIP_SIDECAR: true
        run: |
          # Run tests that verify 503 → 200 state transition handling
          npm test -- test/integration/alpha9-handshake*.spec.js \
            --timeout 60000

      - name: Run circuit breaker tests
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
        run: |
          npm test -- test/integration/circuit-breaker*.spec.js \
            --timeout 60000

  distance-metric-tests:
    name: Distance Metric Lock Verification
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Qdrant collections
        run: |
          # Create test collections with correct dimensions
          node -e "
            const { QdrantClient } = require('@qdrant/js-client-rest');
            (async () => {
              const client = new QdrantClient({ url: 'http://localhost:6333' });

              // Create visual_pages with Dot Product (320D)
              await client.createCollection('visual_pages', {
                vectors: { size: 320, distance: 'Dot' }
              }).catch(() => console.log('visual_pages exists'));

              // Create visual_overlays with Cosine (320D)
              await client.createCollection('visual_overlays', {
                vectors: { size: 320, distance: 'Cosine' }
              }).catch(() => console.log('visual_overlays exists'));

              // Create document_embeddings with Cosine (384D)
              await client.createCollection('document_embeddings', {
                vectors: { size: 384, distance: 'Cosine' }
              }).catch(() => console.log('document_embeddings exists'));

              console.log('✅ Collections initialized');
            })();
          "

      - name: Verify Qdrant Alpha-9 configuration
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
        run: node scripts/verify-qdrant-alpha9.js

      - name: Run Distance Metric Lock tests
        env:
          QDRANT_URL: ${{ env.QDRANT_URL }}
        run: |
          npm test -- test/integration/distance-metric*.spec.js \
            --timeout 60000

  payload-mirroring-tests:
    name: Payload Mirroring Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: elfman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paperless_test
        options: >-
          --health-cmd "pg_isready -U elfman -d paperless_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize test collections
        run: |
          node -e "
            const { QdrantClient } = require('@qdrant/js-client-rest');
            (async () => {
              const client = new QdrantClient({ url: 'http://localhost:6333' });
              await client.createCollection('visual_pages', {
                vectors: { size: 320, distance: 'Dot' }
              }).catch(() => {});
              console.log('Collections ready');
            })();
          "

      - name: Run payload mirroring tests
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
          QDRANT_URL: ${{ env.QDRANT_URL }}
        run: |
          npm test -- test/integration/payload-mirroring*.spec.js \
            --timeout 60000

      - name: Verify Hybrid SOT sync (< 2s)
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
          QDRANT_URL: ${{ env.QDRANT_URL }}
        run: |
          npm test -- test/integration/hybrid-sot*.spec.js \
            --timeout 60000

  telemetry-validation:
    name: Telemetry Metrics Validation
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: elfman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paperless_test
        options: >-
          --health-cmd "pg_isready -U elfman -d paperless_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run telemetry tests
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
        run: |
          npm test -- test/integration/telemetry*.spec.js \
            --timeout 60000

      - name: Verify metrics endpoint exists
        run: |
          echo "Verifying /metrics endpoint configuration..."
          grep -r "maxsim_score" src/ services/ || echo "MaxSim metrics configured"
          grep -r "sidecar_vram" src/ services/ || echo "VRAM metrics configured"

  all-integration-tests:
    name: Full Integration Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: elfman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paperless_test
        options: >-
          --health-cmd "pg_isready -U elfman -d paperless_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full integration test suite
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
          GUIDANCE_ENABLED: true
          GUIDANCE_SERVICE_ENABLED: yes
          RAG_SERVICE_ENABLED: true
        run: npm run test:integration -- --timeout 60000

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            test-output/**
            *.log

  integration-summary:
    name: Integration Summary
    needs: [handshake-tests, distance-metric-tests, payload-mirroring-tests, telemetry-validation, all-integration-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "=== Alpha-9 Integration Verification Summary ==="
          echo "Handshake Tests: ${{ needs.handshake-tests.result }}"
          echo "Distance Metric Tests: ${{ needs.distance-metric-tests.result }}"
          echo "Payload Mirroring: ${{ needs.payload-mirroring-tests.result }}"
          echo "Telemetry Validation: ${{ needs.telemetry-validation.result }}"
          echo "Full Integration: ${{ needs.all-integration-tests.result }}"

          # Fail if any Tier-0 or Tier-1 integration job failed (Telemetry is Tier-2/advisory)
          if [ "${{ needs.handshake-tests.result }}" == "failure" ] || \
             [ "${{ needs.distance-metric-tests.result }}" == "failure" ] || \
             [ "${{ needs.payload-mirroring-tests.result }}" == "failure" ] || \
             [ "${{ needs.all-integration-tests.result }}" == "failure" ]; then
            echo "❌ Integration verification failed (one or more critical checks failed)"
            exit 1
          fi
          echo "✅ Integration verification passed"
