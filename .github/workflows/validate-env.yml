name: Validate environment

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  linux:
    name: validate-env (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: List repo root (debug)
        run: ls -la
      - name: Install npm dependencies
        run: npm ci
      - name: Generate compatibility .env (npm env:sync)
        run: npm run env:sync
      - name: Validate env file (npm env:validate)
        run: npm run env:validate
      - name: Validate env file (Python)
        run: python scripts/validate_env_py.py
      - name: Run unit tests
        env:
          METRICS_INTERNAL_ONLY: 'false'
        run: npm test

  windows:
    name: validate-env (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install npm dependencies
        run: npm ci
      - name: Generate compatibility .env (PowerShell)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sync_dotenv_from_compose_env.ps1
      - name: Validate env file (Python)
        shell: pwsh
        run: python scripts/validate_env_py.py
      - name: Run unit tests
        env:
          METRICS_INTERNAL_ONLY: 'false'
        run: npm test
