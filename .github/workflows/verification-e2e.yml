name: verification-e2e

on:
  workflow_dispatch: {}
  push:
    branches: [ release/** ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: elfman
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paperless_test
        options: >-
          --health-cmd "pg_isready -U elfman -d paperless_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run migrations
        env:
          POSTGRES_URL: 'postgres://elfman:password@localhost:5432/paperless_test'
        run: node migrations/run-migration.js || true
      - name: Run Playwright E2E
        env:
          POSTGRES_URL: 'postgres://elfman:password@localhost:5432/paperless_test'
          PAPERLESS_MOCK_URL: 'http://localhost:3001'
        run: npx playwright test --config=test/playwright.config.ts --reporter=list
      - name: Upload playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**
