name: feedback-persistence-integration

on:
  pull_request:
    paths:
      - 'services/feedback/**'
      - 'services/visual-rag/**'
      - 'migrations/**'
      - 'test/integration/feedback_persistence.test.js'

jobs:
  feedback-persistence-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: paperless_test
        options: >-
          --health-cmd "pg_isready -U testuser -d paperless_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/collections || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Wait for services
        run: |
          echo "Waiting for Postgres and Qdrant to be ready..."
          # Wait for Postgres
          for i in {1..30}; do pg_isready -h localhost -p 5432 -U testuser && break || sleep 2; done
          # Wait for Qdrant
          for i in {1..30}; do curl -sSf http://localhost:6333/collections && break || sleep 2; done

      - name: Run migrations
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: paperless_test
          POSTGRES_HOST: localhost
        run: node migrations/run-migration.js migrations/002_create_feedback_events.sql

      - name: Run feedback persistence integration test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: paperless_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
        run: npm test -- test/integration/feedback_persistence.test.js --reporter spec

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-persistence-logs
          path: test-output/**
