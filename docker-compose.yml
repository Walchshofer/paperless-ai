name: paperless-ngx

services:
  # --- 1. INFRASTRUCTURE ---
  db:
    image: postgres:16
    container_name: paperless_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-elfman} -d $${POSTGRES_DB:-paperless}"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker:
    image: redis:7
    container_name: paperless_broker
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: paperless_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- 2. CORE ---
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless_webserver
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      broker: { condition: service_healthy }
      gotenberg: { condition: service_started }
      tika: { condition: service_started }
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ../paperless-ngx/data:/usr/src/paperless/data
      - ../paperless-ngx/media:/usr/src/paperless/media
      - ../paperless-ngx/export:/usr/src/paperless/export
      - ../paperless-ngx/consume:/usr/src/paperless/consume
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      start_period: 30s

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: paperless_gotenberg
    restart: unless-stopped

  tika:
    image: apache/tika:latest
    container_name: paperless_tika
    restart: unless-stopped

  # --- 3. AI STACK ---
  paperless-ai:
    build:
      context: .
      args:
        - NPM_OMIT_DEV=${NPM_OMIT_DEV:-1}
    container_name: paperless_ai
    restart: unless-stopped
    depends_on:
      webserver: { condition: service_healthy }
      broker: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      visual-rag: { condition: service_healthy }
      guidance_service: { condition: service_healthy }
      text-rag: { condition: service_healthy }
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - VECTOR_STORE=qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RAG_SERVICE_URL=http://text_rag:8004
      - REDIS_URL=redis://broker:6379
      # Explicit metrics/proxy environment enforcement
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - METRICS_INTERNAL_ONLY=${METRICS_INTERNAL_ONLY:-true}
      - METRICS_ALLOWED_CIDRS=127.0.0.1,::1,172.19.0.0/16,172.18.0.0/16,10.0.0.0/8 # Explicit local dev value
    volumes:
      - ../paperless-ngx/data/paperless-ai:/app/data
    networks:
      - monitoring
      - default

  visual-rag:
    build:
      context: ./containers/visual-rag
      dockerfile: Dockerfile
      args:
        - BYALDI_CHECKOUT=${BYALDI_VERSION:-main}
    container_name: visual_rag
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, sys; urllib.request.urlopen('http://localhost:8001/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    environment:
      - MEDIA_DIR=${MEDIA_DIR}
      - INDEX_DIR=${INDEX_DIR}
      - VISUAL_RAG_INDEX_DIR=${VISUAL_RAG_INDEX_DIR}
      - ALLOWED_INDEX_PATHS=/data/documents,/data/imports,/media/paperless
    volumes:
      - visual_model_cache:/root/.cache/huggingface
      - ../paperless-ngx/data/visual_indices:/data/indices
      - ../paperless-ngx/media:/media/paperless:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    networks:
      - monitoring
      - default

  bias-engine:
    build:
      context: ./containers/bias-engine
      dockerfile: Dockerfile.bias-engine
    container_name: bias_engine
    restart: unless-stopped
    ports:
      - "50051:50051"
    env_file: .env
    volumes:
      - bias_engine_models:/models
      - ./containers/bias-engine/docker-healthcheck.py:/usr/local/bin/docker-healthcheck.py:ro
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/docker-healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - monitoring
      - default

  guidance_service:
    build: ./containers/guidance-service
    container_name: guidance_service
    restart: unless-stopped
    depends_on:
      bias-engine: { condition: service_healthy }
    ports:
      - "8002:8002"
    env_file: .env
    volumes:
      - guidance_cache:/app/cache_data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      start_period: 60s
    networks:
      - monitoring
      - default

  text-rag:
    build:
      context: .
      dockerfile: containers/text-rag/Dockerfile
    container_name: text_rag
    restart: unless-stopped
    depends_on:
      qdrant: { condition: service_healthy }
    ports:
      - "8004:8004"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - text_rag_data:/app/data
      - .env:/app/data/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 30s
      start_period: 120s
    networks:
      - monitoring
      - default

  # --- 4. MONITORING ---
  prometheus:
    image: prom/prometheus:latest
    container_name: paperless_prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: paperless_grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - "3001:3000"
    env_file: .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring

volumes:
  pgdata:
  redisdata:
  qdrant_storage:
  visual_model_cache:
  guidance_cache:
  bias_engine_models:
  text_rag_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
  default:
    driver: bridge