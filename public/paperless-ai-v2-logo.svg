<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Paper sheet transforming into AI -->
  <g transform="translate(20, 20) scale(0.8)">
    <!-- Back paper -->
    <path d="M10 10 L80 10 L110 40 L110 130 L10 130 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <!-- Front circuit paper -->
    <path d="M30 30 L90 30 L90 110 L30 110 Z" fill="url(#grad1)" opacity="0.9"/>
    <!-- Circuit lines -->
    <circle cx="45" cy="45" r="3" fill="white"/>
    <circle cx="75" cy="55" r="3" fill="white"/>
    <circle cx="50" cy="90" r="3" fill="white"/>
    <path d="M45 45 L75 55 L50 90" stroke="white" stroke-width="2" fill="none"/>
  </g>

  <!-- Text -->
  <text x="130" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="50" fill="#1e293b">Paperless-AI</text>
  <text x="130" y="110" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#64748b" letter-spacing="2">SEKRETÄR</text>
</svg>