<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="grad2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#374151" stroke-width="10" stroke-dasharray="20 10"/>
  
  <!-- Central Brain/Node -->
  <circle cx="100" cy="100" r="40" fill="url(#grad2)"/>
  <path d="M85 100 L115 100 M100 85 L100 115" stroke="white" stroke-width="4"/>
  
  <!-- Sliders/Bias Controls -->
  <!-- Top -->
  <rect x="95" y="20" width="10" height="30" fill="#6b7280"/>
  <circle cx="100" cy="35" r="8" fill="#10b981"/>
  
  <!-- Right -->
  <rect x="150" y="95" width="30" height="10" fill="#6b7280"/>
  <circle cx="165" cy="100" r="8" fill="#10b981"/>
  
  <!-- Left -->
  <rect x="20" y="95" width="30" height="10" fill="#6b7280"/>
  <circle cx="35" cy="100" r="8" fill="#ef4444"/> <!-- Negative bias -->

  <text x="100" y="170" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="20" fill="#374151">LOGIT BIAS</text>
</svg>