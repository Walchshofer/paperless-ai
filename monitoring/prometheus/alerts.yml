groups:
  - name: guidance_alerts
    rules:
      # Alert if the service is down
      - alert: GuidanceServiceDown
        expr: up{job="guidance-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Guidance Service is down"
          description: "The Guidance Service has been unreachable for more than 1 minute."

      # Alert if latency is too high (P95 > 45s)
      - alert: HighGuidanceLatency
        expr: histogram_quantile(0.95, sum by (le, template) (rate(guidance_request_latency_seconds_bucket[5m]))) > 45
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 Latency detected"
          description: "P95 latency for template {{ $labels.template }} is over 45 seconds."

      # Alert on high error rates
      - alert: HighGuidanceErrorRate
        expr: rate(guidance_requests_total{status="error"}[5m]) / rate(guidance_requests_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High Error Rate in Guidance Service"
          description: "More than 10% of requests are failing for the last 2 minutes."

      # Alert if validation fails consistently
      - alert: GuidanceValidationFailureSpike
        expr: rate(guidance_validation_total{valid="false"}[5m]) / rate(guidance_validation_total[5m]) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Extraction Validation Failures"
          description: "Over 20% of extractions for {{ $labels.template }} failed schema validation."
  - name: pipeline_alerts
    rules:
      - alert: FieldDetectionF1Low
        expr: avg_over_time(field_detection_f1[5m]) < 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Field detection F1 below threshold"
          description: "Field detection F1 has fallen below 0.85 for 5 minutes."
      - alert: SidecarAvailabilityLow
        expr: min_over_time(sidecar_availability[5m]) < 0.995
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Visual sidecar availability degraded"
          description: "Sidecar availability dropped below 99.5%."
      - alert: OcrConflictRateHigh
        expr: max_over_time(ocr_reconciliation_conflict_rate[5m]) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OCR reconciliation conflict rate high"
          description: "OCR conflict rate has exceeded 10%."
      - alert: CircuitBreakerOpenTooLong
        expr: max_over_time(circuit_breaker_state[5m]) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN for 5 minutes"
          description: "Circuit breaker has remained OPEN for more than 5 minutes."
      - alert: PipelineStageLatencyP95High
        expr: histogram_quantile(0.95, sum by (le, stage_name) (rate(pipeline_stage_latency_ms_bucket[5m]))) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline stage latency p95 high"
          description: "Stage p95 latency exceeds 2000ms."
      - alert: UserCorrectionRateHigh
        expr: avg_over_time(user_correction_rate[5m]) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "User correction rate elevated"
          description: "User correction rate exceeded 5%."
