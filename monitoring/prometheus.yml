global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Bias Engine - gRPC Logit Bias Computation
  - job_name: 'bias-engine'
    static_configs:
      - targets: ['bias-engine:8001']
    metrics_path: /metrics

  # Guidance Service - Deterministic JSON Extraction
  - job_name: 'guidance-service'
    static_configs:
      - targets: ['guidance-service:8002']
    metrics_path: /metrics

  # Visual RAG - Vision Pipeline
  - job_name: 'visual-rag'
    static_configs:
      - targets: ['visual-rag:8001']
    metrics_path: /metrics

  # Paperless-AI - Main Application
  - job_name: 'paperless-ai'
    static_configs:
      - targets: ['paperless-ai:3000']
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
